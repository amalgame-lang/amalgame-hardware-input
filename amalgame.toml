# Package manifest — amalgame-hardware-input
#
# Portable input drivers over the Amalgame.Hal interfaces: one driver,
# runs on Raspberry Pi (amalgame-hardware-gpio) and future MCU backends.
#
#   Button         — debounced push button (DigitalIn + Clock)
#   RotaryEncoder  — quadrature encoder (2x DigitalIn)
#
# Pure Amalgame; no C, no system dependency (the backend brings those).

[package]
name              = "amalgame-hardware-input"
version           = "0.1.0"
license           = "Apache-2.0"
description       = "Portable input drivers (debounced Button, RotaryEncoder) over Amalgame.Hal — one driver, runs on Raspberry Pi and future MCU backends. The controls layer for menus, settings, jog wheels."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.8.72"
schema-version    = 1

[stdlib]
classes   = ["Button", "RotaryEncoder"]
header    = "facade-stub.h"
namespace = "Amalgame.Hardware.Input"
facade    = "facade.am"

[dependencies]
amalgame-hal = ">=0.1.0"
